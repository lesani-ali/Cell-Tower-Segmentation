[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seg-cell-tower"
version = "0.1.0"
description = "Cell Tower Segmentation Project"
authors = [
    { name = "Ali Lesani", email = "lesani.sh.ali@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.8,<3.12"

dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",

    "matplotlib==3.7.5",
    "numpy==1.24.4",
    "opencv-python==4.11.0.86",
    "pandas==2.0.3",
    "pillow==10.2.0",
    "pydantic==2.10.6",
    "scikit-image==0.21.0",
    "scipy==1.10.0",
    "tqdm==4.67.1",

    "huggingface-hub==0.28.1",
    "transformers==4.45.0",

    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git@dca509fe793f601edb92606367a655c15ac00fdf",
    "transparent-background @ git+https://github.com/plemeri/transparent-background.git@86fe25d320b14d1e7ca5bb0937e2e29760ba344d",
]

[project.scripts]
segct = "seg_cell_tower.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"